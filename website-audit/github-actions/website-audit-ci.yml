# Copy to .github/workflows/website-audit.yml in YOUR repository.
# Fails the job when the audit score is below MIN_SCORE, when a critical issue exists,
# or when the score dropped by 5 points or more since the previous audit (same URL + monitorId).
#
# Repository secret needed: APIFY_TOKEN.   Cost: $0.49 per run (10 pages).
name: Website audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  # or after each deploy, e.g.:
  # deployment_status:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://staging.example.com
      MIN_SCORE: "70"
    steps:
      - name: Run the audit (synchronous API call)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.apify.com/v2/acts/neocraft~website-audit-all-in-one/run-sync-get-dataset-items?maxTotalChargeUsd=0.6" \
            -H "Authorization: Bearer ${APIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg url "$SITE_URL" '{startUrls: [{url: $url}], maxPagesPerSite: 10, pageRecords: false, pagespeed: false, monitorId: "github-ci"}')" \
            > audit.json

      - name: Gate on score, critical issues and score drop
        run: |
          SITE='[.[] | select((.type // "site") == "site")][0]'
          SCORE=$(jq "${SITE}.summary.score" audit.json)
          CRIT=$(jq "${SITE}.summary.critical" audit.json)
          DELTA=$(jq "${SITE}.changes.scoreDelta // 0" audit.json)
          {
            echo "### Website audit: ${SITE_URL}"
            echo "Score **${SCORE}**/100 (min ${MIN_SCORE}), critical: **${CRIT}**, change since last audit: **${DELTA}**"
            echo
            jq -r "${SITE}.topPriorities[] | \"- [\\(.severity)] \\(.title): \\(.firstStep)\"" audit.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCORE" -lt "$MIN_SCORE" ] || [ "$CRIT" -gt 0 ] || [ "$DELTA" -le -5 ]; then
            echo "::error::Website audit failed (score=$SCORE critical=$CRIT delta=$DELTA)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit
          path: audit.json
